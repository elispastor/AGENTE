<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>SAI - Tarjeta Digital</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
    body { background: #0a1a2e; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
    .container { max-width: 500px; width: 100%; background: #ffffff; border-radius: 32px; padding: 24px; box-shadow: 0 25px 50px -8px rgba(0,0,0,0.6); }
    h1 { text-align: center; color: #0b2b40; font-size: 28px; margin-bottom: 8px; }
    h1 span { color: #fbbf24; }
    .sub { text-align: center; color: #4a5e72; font-size: 14px; margin-bottom: 24px; }

    .form-group { margin-bottom: 16px; }
    .form-group label { font-weight: 600; color: #0b2b40; display: block; margin-bottom: 4px; }
    .form-group input, .form-group button { width: 100%; padding: 14px; border: 1px solid #ccd9e0; border-radius: 12px; font-size: 16px; background: #fff; }
    .form-group small { display: block; color: #6b7f93; font-size: 12px; margin-top: 4px; }
    .form-group button { background: #0b2b40; color: white; font-weight: 700; border: none; cursor: pointer; }
    .form-group button:hover { background: #1a4a60; }

    #mensaje { margin-top: 16px; font-weight: 600; text-align: center; }

    .tarjeta-preview { display: none; margin-top: 24px; padding: 16px; background: #e8f5e9; border-radius: 16px; border: 1px solid #4caf50; }
    .tarjeta-preview h3 { color: #0b2b40; margin-bottom: 8px; }
    .tarjeta-preview .datos { font-size: 15px; }
    .tarjeta-preview .enlace a { word-break: break-all; color: #0b2b40; }
  </style>
</head>
<body>

<div class="container">
  <h1>SAI <span>Digital</span></h1>
  <p class="sub">Crea tu tarjeta con fotos y carrusel</p>

  <!-- FORMULARIO CORREGIDO CON enctype Y name -->
  <form id="formularioSAI" enctype="multipart/form-data">
    <div class="form-group">
      <label>👤 Nombre completo</label>
      <input type="text" id="nombre" name="nombre" required>
    </div>
    <div class="form-group">
      <label>📱 Teléfono / WhatsApp</label>
      <input type="tel" id="telefono" name="telefono" required>
    </div>
    <div class="form-group">
      <label>📧 Correo electrónico</label>
      <input type="email" id="email" name="email" required>
    </div>

    <div class="form-group">
      <label>📸 Foto de portada</label>
      <input type="file" id="fotoPortada" name="fotoPortada" accept="image/*">
      <small>Esta imagen aparecerá al inicio de tu tarjeta.</small>
    </div>

    <div class="form-group">
      <label>🖼️ Fotos para carrusel (máximo 5)</label>
      <input type="file" id="fotosCarrusel" name="fotosCarrusel" accept="image/*" multiple>
      <small>Estas imágenes se mostrarán en un carrusel dentro de tu tarjета.</small>
    </div>

    <div class="form-group">
      <button type="submit">🚀 Generar mi tarjeta</button>
    </div>
  </form>

  <div id="mensaje"></div>

  <div class="tarjeta-preview" id="tarjetaPreview">
    <h3>🧾 Tu tarjeta SAI</h3>
    <div class="datos" id="datosTarjeta"></div>
    <div class="enlace" id="enlaceTarjeta"></div>
  </div>
</div>

<script>
  document.getElementById('formularioSAI').addEventListener('submit', async function(e) {
    e.preventDefault();

    const mensaje = document.getElementById('mensaje');
    mensaje.textContent = '⏳ Generando...';
    mensaje.style.color = 'black';

    // Crear FormData con los datos del formulario
    const formData = new FormData(this);

    try {
      const response = await fetch('/api/generar-tarjeta', {
        method: 'POST',
        body: formData
      });

      if (!response.ok) {
        throw new Error(`Error HTTP: ${response.status}`);
      }

      const resultado = await response.json();

      mensaje.textContent = '✅ Tarjeta generada exitosamente.';
      mensaje.style.color = 'green';

      const preview = document.getElementById('tarjetaPreview');
      document.getElementById('datosTarjeta').innerHTML = `
        <p><strong>Nombre:</strong> ${resultado.tarjeta.nombre}</p>
        <p><strong>Teléfono:</strong> ${resultado.tarjeta.telefono}</p>
        <p><strong>Correo:</strong> ${resultado.tarjeta.email}</p>
      `;
      document.getElementById('enlaceTarjeta').innerHTML = `<a href="${resultado.enlace}" target="_blank">🔗 Ver tarjeta completa</a>`;
      preview.style.display = 'block';

    } catch (error) {
      console.error('Error:', error);
      mensaje.textContent = '❌ Error al generar la tarjeta.';
      mensaje.style.color = 'red';
    }
  });
</script>

</body>
</html>

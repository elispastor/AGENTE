<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Guía Digital - TDI</title>
  <style>
    /* RESET Y BASE */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a1a2e;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      color: #fff;
    }
    .app {
      max-width: 480px;
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 40px;
      padding: 24px 20px 30px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.7);
    }

    /* HEADER */
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 26px;
      font-weight: 800;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }
    .header p {
      font-size: 14px;
      color: #94a3b8;
      margin-top: 4px;
      font-weight: 400;
    }
    .header .badge {
      display: inline-block;
      background: rgba(251, 191, 36, 0.15);
      color: #fbbf24;
      padding: 4px 14px;
      border-radius: 40px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 6px;
      border: 1px solid rgba(251, 191, 36, 0.15);
    }

    /* CHAT */
    .chat-container {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 24px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-top: 8px;
    }
    .chat-messages {
      min-height: 220px;
      max-height: 320px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
      scroll-behavior: smooth;
    }
    .chat-messages::-webkit-scrollbar {
      width: 4px;
    }
    .chat-messages::-webkit-scrollbar-track {
      background: transparent;
    }
    .chat-messages::-webkit-scrollbar-thumb {
      background: #fbbf24;
      border-radius: 10px;
    }

    .msg {
      max-width: 88%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.5;
      word-wrap: break-word;
      animation: fadeIn 0.25s ease;
    }
    .msg.user {
      align-self: flex-end;
      background: #fbbf24;
      color: #0a1a2e;
      border-bottom-right-radius: 4px;
      font-weight: 500;
    }
    .msg.bot {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.07);
      color: #e2e8f0;
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .msg.bot .emoji {
      font-size: 18px;
    }

    .chat-input-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      align-items: center;
    }
    .chat-input-row input {
      flex: 1;
      padding: 14px 18px;
      border-radius: 40px;
      border: none;
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .chat-input-row input::placeholder {
      color: #64748b;
    }
    .chat-input-row input:focus {
      border-color: #fbbf24;
      background: rgba(255, 255, 255, 0.08);
    }
    .chat-input-row button {
      background: #fbbf24;
      border: none;
      width: 52px;
      height: 52px;
      border-radius: 40px;
      font-size: 22px;
      color: #0a1a2e;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-weight: 700;
    }
    .chat-input-row button:hover {
      background: #f59e0b;
      transform: scale(1.02);
    }
    .chat-input-row button:active {
      transform: scale(0.95);
    }

    /* FORMULARIO TARJETA */
    .form-section {
      margin-top: 24px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 24px;
      padding: 18px 16px 20px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .form-section h3 {
      font-size: 18px;
      font-weight: 600;
      color: #fbbf24;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-section label {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 500;
      display: block;
      margin-top: 12px;
      margin-bottom: 4px;
    }
    .form-section input[type="text"],
    .form-section input[type="email"],
    .form-section input[type="tel"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 16px;
      border: none;
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      font-size: 15px;
      outline: none;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: 0.2s;
    }
    .form-section input:focus {
      border-color: #fbbf24;
      background: rgba(255, 255, 255, 0.08);
    }
    .form-section input[type="file"] {
      width: 100%;
      padding: 10px 0;
      color: #94a3b8;
      font-size: 14px;
    }
    .form-section .btn-generar {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: none;
      border-radius: 40px;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #0a1a2e;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 14px rgba(251, 191, 36, 0.25);
    }
    .form-section .btn-generar:hover {
      transform: scale(1.01);
      box-shadow: 0 6px 20px rgba(251, 191, 36, 0.35);
    }
    .form-section .btn-generar:active {
      transform: scale(0.98);
    }
    .form-section .resultado {
      margin-top: 14px;
      padding: 14px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 16px;
      font-size: 14px;
      color: #a0c4e8;
      word-break: break-all;
      border: 1px solid rgba(255, 255, 255, 0.04);
      display: none;
    }
    .form-section .resultado a {
      color: #fbbf24;
      text-decoration: none;
      font-weight: 600;
    }
    .form-section .resultado a:hover {
      text-decoration: underline;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* RESPONSIVE */
    @media (max-width: 480px) {
      .app {
        padding: 16px 14px 22px;
        border-radius: 28px;
      }
      .header h1 {
        font-size: 22px;
      }
      .msg {
        font-size: 14px;
        padding: 10px 14px;
      }
      .chat-input-row input {
        padding: 12px 14px;
        font-size: 14px;
      }
      .chat-input-row button {
        width: 46px;
        height: 46px;
        font-size: 18px;
      }
      .form-section {
        padding: 14px 12px 16px;
      }
      .form-section h3 {
        font-size: 16px;
      }
    }
    @media (min-width: 768px) {
      .app {
        padding: 32px 28px 36px;
      }
      .chat-messages {
        min-height: 260px;
        max-height: 400px;
      }
    }
  </style>
</head>
<body>

  <div class="app">

    <!-- HEADER -->
    <div class="header">
      <h1>🚀 TDI - Tarjeta Digital Inteligente</h1>
      <p>📌 Visibilidad en la Guía Digital de Cúcuta • Ingresos pasivos • Agente IA</p>
      <span class="badge">🐙 PULPO · 24/7</span>
    </div>

    <!-- CHAT -->
    <div class="chat-container">
      <div class="chat-messages" id="chatMessages">
        <div class="msg bot">
          🐙 ¡Hola! Soy <strong>PULPO</strong>, tu agente del TDI. ¿Cómo puedo ayudarte a hacer crecer tu negocio hoy?
        </div>
      </div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="Escribe tu mensaje..." autocomplete="off" />
        <button id="chatSendBtn">➤</button>
      </div>
    </div>

    <!-- FORMULARIO TARJETA -->
    <div class="form-section">
      <h3>📇 Genera tu tarjeta digital</h3>
      <form id="tarjetaForm" enctype="multipart/form-data">
        <label>Nombre del negocio</label>
        <input type="text" id="nombre" placeholder="Ej: Taller El Tigre" required />

        <label>Teléfono (con código de país)</label>
        <input type="tel" id="telefono" placeholder="Ej: 573001234567" required />

        <label>Email</label>
        <input type="email" id="email" placeholder="tu@negocio.com" required />

        <label>Foto de portada (logo)</label>
        <input type="file" id="fotoPortada" accept="image/*" />

        <label>Fotos para el carrusel (máximo 5)</label>
        <input type="file" id="fotosCarrusel" accept="image/*" multiple />

        <button type="submit" class="btn-generar">🚀 Generar tarjeta</button>
      </form>
      <div class="resultado" id="resultado"></div>
    </div>

  </div>

  <script>
    // =============================================
    // CHAT - PULPO
    // =============================================
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const chatSendBtn = document.getElementById('chatSendBtn');

    function addMessage(text, sender) {
      const div = document.createElement('div');
      div.className = 'msg ' + sender;
      div.textContent = text;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendMessage() {
      const msg = chatInput.value.trim();
      if (!msg) return;
      addMessage(msg, 'user');
      chatInput.value = '';

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mensaje: msg })
        });
        const data = await res.json();
        addMessage(data.respuesta || '🐙 No entendí, intenta de nuevo.', 'bot');
      } catch (err) {
        addMessage('❌ Error de conexión. Revisa tu internet.', 'bot');
      }
    }

    chatSendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // =============================================
    // FORMULARIO - Generar tarjeta
    // =============================================
    const form = document.getElementById('tarjetaForm');
    const resultado = document.getElementById('resultado');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      resultado.style.display = 'block';
      resultado.innerHTML = '⏳ Generando tu tarjeta...';

      const formData = new FormData();
      formData.append('nombre', document.getElementById('nombre').value.trim());
      formData.append('telefono', document.getElementById('telefono').value.trim());
      formData.append('email', document.getElementById('email').value.trim());

      const fotoPortada = document.getElementById('fotoPortada').files[0];
      if (fotoPortada) formData.append('fotoPortada', fotoPortada);

      const fotosCarrusel = document.getElementById('fotosCarrusel').files;
      for (let i = 0; i < fotosCarrusel.length; i++) {
        formData.append('fotosCarrusel', fotosCarrusel[i]);
      }

      try {
        const res = await fetch('/api/generar-tarjeta', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();

        if (data.enlace) {
          resultado.innerHTML = `
            ✅ Tarjeta generada exitosamente.<br />
            🔗 <a href="${data.enlace}" target="_blank">${data.enlace}</a>
          `;
        } else {
          resultado.innerHTML = '❌ Error al generar la tarjeta. Intenta de nuevo.';
        }
      } catch (err) {
        resultado.innerHTML = '❌ Error de conexión. Revisa tu internet.';
      }
    });
  </script>

</body>
</html>

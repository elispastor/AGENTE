<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAI Digital - Tarjeta SAI</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: 20px auto; padding: 16px; background: #f5f5f5; }
    h1 { color: #0b2b40; text-align: center; font-size: 24px; }
    #chat { border: 1px solid #ddd; height: 200px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: white; border-radius: 10px; font-size: 14px; }
    #input { width: 75%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
    #send { padding: 10px 16px; background: #0b2b40; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; }
    .user { background: #e1f5fe; padding: 8px; margin: 4px 0; border-radius: 8px; }
    .bot { background: #f0f0f0; padding: 8px; margin: 4px 0; border-radius: 8px; }
    .input-area { display: flex; gap: 8px; flex-wrap: wrap; }
    .input-area input { flex: 1; min-width: 150px; }

    #formulario-sai { background: white; padding: 16px; border-radius: 10px; margin-top: 20px; border: 1px solid #ddd; }
    #formulario-sai h2 { font-size: 20px; margin-top: 0; }
    #formulario-sai input, #formulario-sai button { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
    #formulario-sai button { background: #0b2b40; color: white; border: none; cursor: pointer; }
    #formulario-sai button:hover { background: #1a4a60; }
    #mensaje { margin-top: 12px; font-weight: bold; }

    #tarjeta-generada { display: none; margin-top: 20px; padding: 16px; background: #e8f5e9; border-radius: 10px; border: 1px solid #4caf50; }
    #tarjeta-generada h3 { margin-top: 0; }
    .file-label { display: block; margin: 8px 0 4px; font-weight: bold; font-size: 14px; color: #0b2b40; }
    .file-hint { font-size: 12px; color: #666; margin-bottom: 8px; display: block; }
  </style>
</head>
<body>
  <h1>🧠 SAI Digital</h1>

  <!-- CHAT -->
  <div id="chat"></div>
  <div class="input-area">
    <input type="text" id="input" placeholder="Escribe tu mensaje...">
    <button id="send">Enviar</button>
  </div>

  <!-- FORMULARIO -->
  <div id="formulario-sai">
    <h2>📋 Crea tu tarjeta</h2>
    <form id="formularioRegistro" enctype="multipart/form-data">
      <input type="text" id="nombre" placeholder="Nombre completo" required>
      <input type="tel" id="telefono" placeholder="Teléfono / WhatsApp" required>
      <input type="email" id="email" placeholder="Correo electrónico">
      
      <label class="file-label">📸 Foto de portada</label>
      <input type="file" id="fotoPortada" accept="image/*">
      <span class="file-hint">Esta imagen aparecerá al inicio de tu tarjeta.</span>

      <label class="file-label">🖼️ Fotos para carrusel (máximo 5)</label>
      <input type="file" id="fotosCarrusel" accept="image/*" multiple>
      <span class="file-hint">Estas imágenes se mostrarán en un carrusel dentro de tu tarjeta.</span>

      <button type="submit">🚀 Generar mi tarjeta</button>
    </form>
    <div id="mensaje"></div>

    <div id="tarjeta-generada">
      <h3>🧾 Tu tarjeta SAI</h3>
      <p id="tarjeta-contenido"></p>
      <p>🔗 Comparte tu enlace: <a id="enlace-tarjeta" href="#" target="_blank">Clic aquí</a></p>
    </div>
  </div>

  <script>
    // ===== CHAT =====
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const send = document.getElementById('send');

    function addMessage(text, type) {
      const div = document.createElement('div');
      div.className = type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const message = input.value.trim();
      if (!message) return;
      addMessage(message, 'user');
      input.value = '';

      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mensaje: message })
        });
        const data = await response.json();
        addMessage(data.respuesta || 'No pude procesar tu mensaje.', 'bot');
      } catch (error) {
        addMessage('Error de conexión', 'bot');
      }
    }

    send.addEventListener('click', sendMessage);
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    addMessage('👋 ¡Hola! Soy MAP, tu agente SAI. ¿Cómo puedo ayudarte?', 'bot');

    // ===== FORMULARIO SAI =====
    document.getElementById('formularioRegistro').addEventListener('submit', async function (event) {
      event.preventDefault();

      const mensaje = document.getElementById('mensaje');
      const nombre = document.getElementById('nombre').value.trim();
      const telefono = document.getElementById('telefono').value.trim();
      const email = document.getElementById('email').value.trim();
      const fotoPortada = document.getElementById('fotoPortada').files[0];
      const fotosCarrusel = document.getElementById('fotosCarrusel').files;

      mensaje.textContent = 'Generando tarjeta...';
      mensaje.style.color = 'black';

      const formData = new FormData();
      formData.append('nombre', nombre);
      formData.append('telefono', telefono);
      formData.append('email', email);
      if (fotoPortada) formData.append('fotoPortada', fotoPortada);
      for (let i = 0; i < Math.min(fotosCarrusel.length, 5); i++) {
        formData.append('fotosCarrusel', fotosCarrusel[i]);
      }

      try {
        const response = await fetch('/api/generar-tarjeta', {
          method: 'POST',
          body: formData
        });

        const resultado = await response.json();

        if (!response.ok) {
          throw new Error(resultado.error || 'Error al generar la tarjeta');
        }

        mensaje.textContent = resultado.mensaje;
        mensaje.style.color = 'green';

        const tarjetaDiv = document.getElementById('tarjeta-generada');
        const tarjetaContenido = document.getElementById('tarjeta-contenido');
        const enlaceTarjeta = document.getElementById('enlace-tarjeta');

        tarjetaContenido.innerHTML = `
          👤 <strong>Nombre:</strong> ${nombre}<br>
          📱 <strong>Teléfono:</strong> ${telefono}<br>
          📧 <strong>Correo:</strong> ${email}<br>
          ✅ Tarjeta generada con éxito.
        `;
        enlaceTarjeta.href = resultado.enlace;
        enlaceTarjeta.textContent = resultado.enlace;
        tarjetaDiv.style.display = 'block';

        this.reset();

      } catch (error) {
        console.error('Error:', error);
        mensaje.textContent = '❌ Error: ' + error.message;
        mensaje.style.color = 'red';
      }
    });
  </script>
</body>
</html>

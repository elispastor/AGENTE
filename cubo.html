<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cubo Interactivo</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #0a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }
    .scene {
      width: 300px;
      height: 300px;
      perspective: 800px;
    }
    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.1s ease;
      transform: rotateX(-20deg) rotateY(30deg);
    }
    .face {
      position: absolute;
      width: 300px;
      height: 300px;
      background: rgba(255,255,255,0.9);
      border: 2px solid #fbbf24;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      color: #0b2b40;
      backface-visibility: hidden;
      box-shadow: 0 0 30px rgba(251,191,36,0.3);
      padding: 20px;
      background: linear-gradient(145deg, #ffffff, #f0f4f8);
    }
    .face img {
      max-width: 80%;
      max-height: 60%;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .face .icon {
      font-size: 48px;
      margin-bottom: 8px;
    }
    .front  { transform: rotateY(0deg) translateZ(150px); }
    .back   { transform: rotateY(180deg) translateZ(150px); }
    .right  { transform: rotateY(90deg) translateZ(150px); }
    .left   { transform: rotateY(-90deg) translateZ(150px); }
    .top    { transform: rotateX(90deg) translateZ(150px); }
    .bottom { transform: rotateX(-90deg) translateZ(150px); }

    .controls {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
      padding: 12px 24px;
      border-radius: 60px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .controls button {
      background: #fbbf24;
      border: none;
      color: #0b1a2e;
      font-weight: bold;
      padding: 10px 24px;
      border-radius: 40px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.2s;
    }
    .controls button:hover {
      background: #f59e0b;
      transform: scale(1.05);
    }
    .controls .info {
      color: #a0c4e8;
      font-size: 14px;
      display: flex;
      align-items: center;
      margin-right: 12px;
    }
  </style>
</head>
<body>

<div class="scene">
  <div class="cube" id="cube">
    <!-- CARA 1: Foto o logotipo -->
    <div class="face front">
      <div class="icon">🐙</div>
      <span>Guía Digital</span>
      <img src="https://via.placeholder.com/150/0b2b40/fbbf24?text=SAI" alt="SAI">
    </div>
    <!-- CARA 2: Datos -->
    <div class="face back">
      <div class="icon">📇</div>
      <span>Elis Suárez</span>
      <span style="font-size:16px; font-weight:400;">+58 424-4259543</span>
      <span style="font-size:16px; font-weight:400;">elispastor@gmail.com</span>
    </div>
    <!-- CARA 3: Fotos carrusel -->
    <div class="face right">
      <div class="icon">🖼️</div>
      <span>Carrusel</span>
      <img src="https://via.placeholder.com/150/1a4b6d/fbbf24?text=Foto1" alt="Foto">
    </div>
    <!-- CARA 4: Redes -->
    <div class="face left">
      <div class="icon">📱</div>
      <span>Contacto</span>
      <span style="font-size:16px; font-weight:400;">WhatsApp: +58 424-4259543</span>
    </div>
    <!-- CARA 5: QR -->
    <div class="face top">
      <div class="icon">📲</div>
      <span>Escanea</span>
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://guia-digital.com" alt="QR">
    </div>
    <!-- CARA 6: Frase -->
    <div class="face bottom">
      <div class="icon">💡</div>
      <span>“El futuro es digital”</span>
      <span style="font-size:14px; font-weight:400;">Genera ingresos con tu tarjeta</span>
    </div>
  </div>
</div>

<div class="controls">
  <span class="info">🔄 Gira el cubo:</span>
  <button id="btnAuto">▶ Auto</button>
  <button id="btnStop">⏹ Stop</button>
</div>

<script>
  const cube = document.getElementById('cube');
  let isDragging = false;
  let previousMouseX = 0;
  let previousMouseY = 0;
  let rotX = -20;
  let rotY = 30;
  let autoRotate = true;
  let animationId = null;

  // ===== ROTACIÓN AUTOMÁTICA =====
  function startAutoRotate() {
    if (animationId) cancelAnimationFrame(animationId);
    let lastTime = 0;
    const speed = 0.005;

    function rotateStep(time) {
      if (!autoRotate) {
        animationId = null;
        return;
      }
      if (lastTime === 0) lastTime = time;
      const delta = time - lastTime;
      lastTime = time;
      rotY += delta * speed;
      cube.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
      animationId = requestAnimationFrame(rotateStep);
    }
    autoRotate = true;
    animationId = requestAnimationFrame(rotateStep);
  }

  function stopAutoRotate() {
    autoRotate = false;
    if (animationId) {
      cancelAnimationFrame(animationId);
      animationId = null;
    }
  }

  // ===== CONTROL MANUAL CON MOUSE (ARRESTRE) =====
  cube.addEventListener('mousedown', (e) => {
    stopAutoRotate();
    isDragging = true;
    previousMouseX = e.clientX;
    previousMouseY = e.clientY;
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const deltaX = e.clientX - previousMouseX;
    const deltaY = e.clientY - previousMouseY;
    rotY += deltaX * 0.5;
    rotX -= deltaY * 0.5;
    rotX = Math.min(90, Math.max(-90, rotX));
    cube.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    previousMouseX = e.clientX;
    previousMouseY = e.clientY;
  });

  window.addEventListener('mouseup', () => {
    isDragging = false;
  });

  // ===== CONTROL TÁCTIL (MÓVIL) =====
  let touchStartX = 0;
  let touchStartY = 0;

  cube.addEventListener('touchstart', (e) => {
    stopAutoRotate();
    const touch = e.touches[0];
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
  }, { passive: true });

  cube.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    const deltaX = touch.clientX - touchStartX;
    const deltaY = touch.clientY - touchStartY;
    rotY += deltaX * 0.5;
    rotX -= deltaY * 0.5;
    rotX = Math.min(90, Math.max(-90, rotX));
    cube.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
  }, { passive: false });

  // ===== BOTONES =====
  document.getElementById('btnAuto').addEventListener('click', startAutoRotate);
  document.getElementById('btnStop').addEventListener('click', stopAutoRotate);

  // ===== INICIO =====
  startAutoRotate();
</script>

</body>
</html>

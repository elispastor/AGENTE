<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guía Digital - Motorizados</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .container {
      max-width: 720px;
      width: 100%;
      background: white;
      border-radius: 32px;
      padding: 32px 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 28px;
      color: #0b2b40;
      text-align: center;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .subtitle {
      text-align: center;
      color: #4a6a7a;
      font-size: 16px;
      margin-bottom: 32px;
    }

    /* ===== BOTONES GIGANTES ===== */
    .botones-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
    }
    .btn-mega {
      width: 100%;
      padding: 24px 16px;
      border: none;
      border-radius: 20px;
      font-size: 22px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.2s;
      text-align: center;
      box-shadow: 0 6px 0 rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .btn-mega:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.2);
    }
    .btn-mega .icono { font-size: 36px; }
    .btn-mega .subtitulo {
      font-size: 14px;
      font-weight: 400;
      opacity: 0.85;
    }

    .btn-mega.motorizados { background: #0b2b40; }
    .btn-mega.negocios    { background: #1a5a6a; }
    .btn-mega.particulares { background: #2a7a6a; }

    /* ===== FORMULARIOS (ocultos por defecto) ===== */
    .formulario-seccion {
      display: none;
      margin-top: 20px;
      padding: 20px 16px;
      background: #f8fafc;
      border-radius: 20px;
      border: 1px solid #e0e8ee;
    }
    .formulario-seccion.activo {
      display: block;
    }
    .formulario-seccion h2 {
      font-size: 20px;
      color: #0b2b40;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .formulario-seccion input,
    .formulario-seccion button {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 12px;
      font-size: 16px;
      border: 1px solid #ccd9e0;
      border-radius: 14px;
      background: white;
      box-sizing: border-box;
    }
    .formulario-seccion button {
      background: #0b2b40;
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .formulario-seccion button:hover {
      background: #1a4a60;
    }
    #mensaje {
      margin-top: 12px;
      font-weight: 600;
      text-align: center;
    }

    /* ===== TARJETA GENERADA ===== */
    #tarjeta-generada {
      display: none;
      margin-top: 24px;
      padding: 20px;
      background: #e6f4ea;
      border-radius: 20px;
      border: 1px solid #2e7d5e;
    }
    #tarjeta-generada h3 {
      color: #0b2b40;
      margin-bottom: 12px;
    }
    #tarjeta-generada .datos {
      font-size: 16px;
      line-height: 1.8;
    }
    #enlace-tarjeta {
      word-break: break-all;
      color: #0b2b40;
      font-weight: 600;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>🏍️ Guía Digital</h1>
  <p class="subtitle">Elige tu perfil y comienza a registrar tu tarjeta digital</p>

  <!-- ===== BOTONES ===== -->
  <div class="botones-grid">
    <button class="btn-mega motorizados" data-tipo="motorizados">
      <span class="icono">🏍️</span>
      Motorizados
      <span class="subtitulo">Conductores de moto, delivery, mensajería</span>
    </button>

    <button class="btn-mega negocios" data-tipo="negocios">
      <span class="icono">🏪</span>
      Negocios / Comercios
      <span class="subtitulo">Tiendas, talleres, emprendimientos</span>
    </button>

    <button class="btn-mega particulares" data-tipo="particulares">
      <span class="icono">👤</span>
      Particulares
      <span class="subtitulo">Personas naturales, profesionales independientes</span>
    </button>
  </div>

  <!-- ===== FORMULARIOS (ocultos) ===== -->
  <div id="form-motorizados" class="formulario-seccion">
    <h2>🏍️ Registro Motorizado</h2>
    <form id="formMotorizado">
      <input type="text" id="m-nombre" placeholder="Nombre completo *" required>
      <input type="tel" id="m-telefono" placeholder="Teléfono / WhatsApp *" required>
      <input type="text" id="m-linea" placeholder="Línea / Ruta (opcional)">
      <input type="text" id="m-direccion" placeholder="Dirección (opcional)">
      <button type="submit">Generar tarjeta</button>
    </form>
    <div id="mensaje-motorizado"></div>
  </div>

  <div id="form-negocios" class="formulario-seccion">
    <h2>🏪 Registro Negocio</h2>
    <form id="formNegocio">
      <input type="text" id="n-nombre" placeholder="Nombre del negocio *" required>
      <input type="tel" id="n-telefono" placeholder="Teléfono / WhatsApp *" required>
      <input type="text" id="n-direccion" placeholder="Dirección (opcional)">
      <input type="text" id="n-categoria" placeholder="Categoría (ej: taller, tienda, etc.)">
      <button type="submit">Generar tarjeta</button>
    </form>
    <div id="mensaje-negocio"></div>
  </div>

  <div id="form-particulares" class="formulario-seccion">
    <h2>👤 Registro Particular</h2>
    <form id="formParticular">
      <input type="text" id="p-nombre" placeholder="Nombre completo *" required>
      <input type="tel" id="p-telefono" placeholder="Teléfono / WhatsApp *" required>
      <input type="text" id="p-profesion" placeholder="Profesión / oficio (opcional)">
      <input type="text" id="p-direccion" placeholder="Dirección (opcional)">
      <button type="submit">Generar tarjeta</button>
    </form>
    <div id="mensaje-particular"></div>
  </div>

  <!-- ===== TARJETA GENERADA (se muestra al enviar) ===== -->
  <div id="tarjeta-generada">
    <h3>🧾 Tu tarjeta digital</h3>
    <div id="tarjeta-contenido" class="datos"></div>
    <p style="margin-top:12px;">🔗 Comparte tu enlace:<br>
      <a id="enlace-tarjeta" href="#" target="_blank">Clic aquí</a>
    </p>
  </div>
</div>

<script>
  // ===== LÓGICA DE BOTONES: mostrar formulario correspondiente =====
  const botones = document.querySelectorAll('.btn-mega');
  const secciones = {
    motorizados: document.getElementById('form-motorizados'),
    negocios: document.getElementById('form-negocios'),
    particulares: document.getElementById('form-particulares')
  };

  botones.forEach(btn => {
    btn.addEventListener('click', function() {
      const tipo = this.dataset.tipo;
      // Ocultar todos los formularios
      Object.values(secciones).forEach(sec => sec.classList.remove('activo'));
      // Mostrar el seleccionado
      if (secciones[tipo]) {
        secciones[tipo].classList.add('activo');
        secciones[tipo].scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
      // Ocultar tarjeta anterior
      document.getElementById('tarjeta-generada').style.display = 'none';
    });
  });

  // ===== FUNCIÓN GENÉRICA PARA ENVÍO DE FORMULARIOS =====
  async function enviarFormulario(url, datos, mensajeId, tarjetaContenedor, tarjetaContenido, enlaceTarjeta) {
    const mensaje = document.getElementById(mensajeId);
    mensaje.textContent = 'Enviando...';
    mensaje.style.color = 'black';

    try {
      const respuesta = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(datos)
      });
      const resultado = await respuesta.json();
      if (!respuesta.ok) throw new Error(resultado.error || 'Error en el servidor');

      mensaje.textContent = resultado.mensaje;
      mensaje.style.color = 'green';

      // Mostrar tarjeta
      const idUnico = Date.now();
      const enlace = `https://guia-digital-z612.onrender.com/tarjeta/${idUnico}`;

      tarjetaContenido.innerHTML = Object.entries(datos)
        .map(([k, v]) => `<strong>${k}:</strong> ${v}`)
        .join('<br>');

      enlaceTarjeta.href = enlace;
      enlaceTarjeta.textContent = enlace;
      tarjetaContenedor.style.display = 'block';

    } catch (error) {
      mensaje.textContent = '❌ Error: ' + error.message;
      mensaje.style.color = 'red';
    }
  }

  // ===== FORMULARIO MOTORIZADO =====
  document.getElementById('formMotorizado').addEventListener('submit', function(e) {
    e.preventDefault();
    const datos = {
      nombre: document.getElementById('m-nombre').value.trim(),
      telefono: document.getElementById('m-telefono').value.trim(),
      linea: document.getElementById('m-linea').value.trim(),
      direccion: document.getElementById('m-direccion').value.trim()
    };
    enviarFormulario(
      'https://guia-digital-z612.onrender.com/api/motorizados/registro',
      datos,
      'mensaje-motorizado',
      document.getElementById('tarjeta-generada'),
      document.getElementById('tarjeta-contenido'),
      document.getElementById('enlace-tarjeta')
    );
  });

  // ===== FORMULARIO NEGOCIO =====
  document.getElementById('formNegocio').addEventListener('submit', function(e) {
    e.preventDefault();
    const datos = {
      nombre: document.getElementById('n-nombre').value.trim(),
      telefono: document.getElementById('n-telefono').value.trim(),
      direccion: document.getElementById('n-direccion').value.trim(),
      categoria: document.getElementById('n-categoria').value.trim()
    };
    enviarFormulario(
      'https://guia-digital-z612.onrender.com/api/negocios/registro',
      datos,
      'mensaje-negocio',
      document.getElementById('tarjeta-generada'),
      document.getElementById('tarjeta-contenido'),
      document.getElementById('enlace-tarjeta')
    );
  });

  // ===== FORMULARIO PARTICULAR =====
  document.getElementById('formParticular').addEventListener('submit', function(e) {
    e.preventDefault();
    const datos = {
      nombre: document.getElementById('p-nombre').value.trim(),
      telefono: document.getElementById('p-telefono').value.trim(),
      profesion: document.getElementById('p-profesion').value.trim(),
      direccion: document.getElementById('p-direccion').value.trim()
    };
    enviarFormulario(
      'https://guia-digital-z612.onrender.com/api/particulares/registro',
      datos,
      'mensaje-particular',
      document.getElementById('tarjeta-generada'),
      document.getElementById('tarjeta-contenido'),
      document.getElementById('enlace-tarjeta')
    );
  });
</script>
</body>
</html>
